name: Linux CI (SHM Hardening)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  shm-verification:
    name: Linux (g++ / real /dev/shm) - build.sh, ASan/UBSan, 10M-event harness
    runs-on: ubuntu-22.04
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          ${CXX} --version
          python3 --version

      - name: Verify POSIX /dev/shm is available (Milestone 1/2 target)
        run: |
          test -d /dev/shm
          df -h /dev/shm

      # Builds benchmarks/build/harness_benchmark (-O3 -march=native) and
      # benchmarks/build/harness_benchmark_sanitized (-fsanitize=address,undefined),
      # exactly as documented in that script's own header comment.
      - name: Run benchmarks/build.sh (release + ASan/UBSan targets)
        run: |
          chmod +x benchmarks/build.sh
          ./benchmarks/build.sh

      - name: Verify both binaries were produced
        run: |
          test -x benchmarks/build/harness_benchmark
          test -x benchmarks/build/harness_benchmark_sanitized

      # Correctness, not performance -- sanitizer instrumentation makes
      # latency numbers meaningless (see build.sh), so this uses a small
      # event count and checks for a clean exit, not the numbers printed.
      # Exercises both push paths (Milestone 1's bounded and decoupled
      # modes) under ASan+UBSan.
      - name: ASan/UBSan target -- decoupled overwrite mode
        working-directory: benchmarks
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ./build/harness_benchmark_sanitized --name ci_asan_overwrite --events 200000 --capacity 4096 --unlink-when-done

      - name: ASan/UBSan target -- bounded backpressure mode (with a live consumer)
        working-directory: benchmarks
        shell: bash
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ./build/harness_benchmark_sanitized --name ci_asan_backpressure --events 200000 --capacity 4096 --backpressure &
          producer_pid=$!
          sleep 0.5
          python3 consumer.py --name ci_asan_backpressure --events 200000 --idle-timeout-s 5
          consumer_status=$?
          wait "$producer_pid"
          producer_status=$?
          echo "producer_status=$producer_status consumer_status=$consumer_status"
          [ "$producer_status" -eq 0 ] && [ "$consumer_status" -eq 0 ]

      # Milestone 2: SIGINT must detach this process's view cleanly (unmap,
      # no unlink while the segment name is still in use) with no
      # ASan-reported leak or use-after-free from the teardown path --
      # exactly the check benchmarks/build.sh's own usage output suggests.
      # A large --events count with no consumer keeps the producer spinning
      # in push_overwrite() long enough for the SIGINT to land mid-loop
      # rather than after natural completion.
      - name: ASan/UBSan target -- SIGINT clean-teardown check
        working-directory: benchmarks
        shell: bash
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ./build/harness_benchmark_sanitized --name ci_asan_sigint --events 100000000 --capacity 65536 &
          pid=$!
          sleep 1
          kill -INT "$pid"
          wait "$pid"
          status=$?
          echo "exit status after SIGINT: $status"
          # A clean, caught SIGINT exits 0 (main() returns after the loop
          # observes shutdown_requested()); a sanitizer-reported fault
          # would exit non-zero instead.
          [ "$status" -eq 0 ]

      # Milestone 1 (Dynamic & User-Defined Wire Schemas): builds
      # tests/test_dynamic_schema.cpp the same way build.sh builds
      # harness_benchmark.cpp above (release + ASan/UBSan, direct g++, no
      # CMake) since this workflow's whole point is exercising the real
      # POSIX shm_open/mmap path, not the CMake build already covered by
      # build.yml's linux-cmake job.
      - name: Build test_dynamic_schema (release + ASan/UBSan)
        run: |
          mkdir -p tests/build
          g++ -O3 -march=native -std=c++17 -Wall -Wextra -Wpedantic -Iinclude \
            tests/test_dynamic_schema.cpp -o tests/build/test_dynamic_schema -lpthread
          g++ -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c++17 \
            -Wall -Wextra -Wpedantic -Iinclude \
            tests/test_dynamic_schema.cpp -o tests/build/test_dynamic_schema_sanitized -lpthread

      - name: Verify test_dynamic_schema binaries were produced
        run: |
          test -x tests/build/test_dynamic_schema
          test -x tests/build/test_dynamic_schema_sanitized

      # Genuinely cross-process (two separate OS processes, not two
      # threads): consumer owns ring creation/unlink -- same convention as
      # AnimusCore_v1/shm_ipc_bench.cpp -- and the producer retries open()
      # to absorb the startup race. Runs under ASan+UBSan for correctness,
      # same reasoning as the harness_benchmark_sanitized steps above:
      # this checks for a clean exit and the consumer's own PASS lines,
      # not performance. Covers both the primary, backward-compatible
      # 40-byte ExecutionEvent schema and the alternate 64-byte
      # OrderBookL2 schema (include/animus/schema.hpp), including the
      # negative case -- ShmRing<T>::open() rejecting a cross-schema
      # attach (see include/animus/shm_ipc.hpp) -- which the consumer role
      # checks itself after the round trip.
      - name: test_dynamic_schema -- ExecutionEvent (40B) cross-process, ASan/UBSan
        working-directory: tests
        shell: bash
        run: |
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          ./build/test_dynamic_schema_sanitized --consumer execution_event ci_dynschema_ee 20000 > consumer_ee.log 2>&1 &
          consumer_pid=$!
          sleep 0.5
          ./build/test_dynamic_schema_sanitized --producer execution_event ci_dynschema_ee 20000 > producer_ee.log 2>&1
          producer_status=$?
          wait "$consumer_pid"
          consumer_status=$?
          cat consumer_ee.log
          cat producer_ee.log
          echo "producer_status=$producer_status consumer_status=$consumer_status"
          grep -q "all 20000 records verified byte-for-byte" consumer_ee.log
          grep -q "cross-schema open() with animus::schema::OrderBookL2 correctly rejected" consumer_ee.log
          [ "$producer_status" -eq 0 ] && [ "$consumer_status" -eq 0 ]

      - name: test_dynamic_schema -- OrderBookL2 (64B) cross-process, ASan/UBSan
        working-directory: tests
        shell: bash
        run: |
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          ./build/test_dynamic_schema_sanitized --consumer orderbook_l2 ci_dynschema_ob 20000 > consumer_ob.log 2>&1 &
          consumer_pid=$!
          sleep 0.5
          ./build/test_dynamic_schema_sanitized --producer orderbook_l2 ci_dynschema_ob 20000 > producer_ob.log 2>&1
          producer_status=$?
          wait "$consumer_pid"
          consumer_status=$?
          cat consumer_ob.log
          cat producer_ob.log
          echo "producer_status=$producer_status consumer_status=$consumer_status"
          grep -q "all 20000 records verified byte-for-byte" consumer_ob.log
          grep -q "cross-schema open() with animus::ExecutionEvent correctly rejected" consumer_ob.log
          [ "$producer_status" -eq 0 ] && [ "$consumer_status" -eq 0 ]

      # Milestone 2 (Single-Producer Multi-Consumer Broadcast Ring, this
      # conversation's own numbering -- distinct from the pre-existing
      # internal "Milestone 2/3/4" labels used elsewhere in this workflow
      # for SIGINT handling / GIL discipline / the cross-process harness):
      # builds tests/test_spmc.cpp the same way as test_dynamic_schema
      # above (release + ASan/UBSan, direct g++, no CMake).
      - name: Build test_spmc (release + ASan/UBSan)
        run: |
          g++ -O3 -march=native -std=c++17 -Wall -Wextra -Wpedantic -Iinclude \
            tests/test_spmc.cpp -o tests/build/test_spmc -lpthread
          g++ -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c++17 \
            -Wall -Wextra -Wpedantic -Iinclude \
            tests/test_spmc.cpp -o tests/build/test_spmc_sanitized -lpthread

      - name: Verify test_spmc binaries were produced
        run: |
          test -x tests/build/test_spmc
          test -x tests/build/test_spmc_sanitized

      # Genuinely cross-process (three separate OS processes): one
      # producer broadcasting to two independently-paced consumers -- a
      # spin-polling one that must receive every record with zero
      # overruns, and a deliberately throttled one that must fall behind,
      # correctly detect the overrun, and account every skipped record
      # (received + overrun_count == total broadcast), all without
      # stalling the producer or the fast consumer (proven by all three
      # completing at all, not just their individual exit codes -- a stall
      # would show up as this step timing out). The fast consumer owns
      # ring creation (see tests/test_spmc.cpp's own header comment for
      # why the producer, despite being the only producer, is not the
      # right role to own it); the producer itself waits ~500ms after
      # attaching before it starts broadcasting, giving both consumers
      # room to open() first.
      - name: test_spmc -- 1 producer, 1 fast consumer, 1 throttled consumer, ASan/UBSan
        working-directory: tests
        shell: bash
        run: |
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          ./build/test_spmc_sanitized --consumer-fast ci_spmc 3000000 > fast.log 2>&1 &
          fast_pid=$!
          sleep 0.5
          ./build/test_spmc_sanitized --consumer-slow ci_spmc 3000000 > slow.log 2>&1 &
          slow_pid=$!
          ./build/test_spmc_sanitized --producer ci_spmc 3000000 > producer.log 2>&1
          producer_status=$?
          wait "$fast_pid"
          fast_status=$?
          wait "$slow_pid"
          slow_status=$?
          cat producer.log
          cat fast.log
          cat slow.log
          echo "producer_status=$producer_status fast_status=$fast_status slow_status=$slow_status"
          grep -q "PASS: all 3000000 records received in order with zero overruns" fast.log
          grep -q "PASS: overrun correctly detected and accounted" slow.log
          [ "$producer_status" -eq 0 ] && [ "$fast_status" -eq 0 ] && [ "$slow_status" -eq 0 ]

      # Milestone 3 (Non-Blocking Telemetry & Observability Layer, this
      # conversation's own numbering -- see the Milestone 2 step above for
      # why that's called out explicitly). Single-process (see
      # tests/test_telemetry.cpp's own header comment for why
      # AnimusGetMetrics() doesn't need a second OS process to exercise),
      # so this builds and runs it directly, no producer/consumer
      # orchestration needed -- release for a fast run, then the ASan/UBSan
      # binary too since this header does its own reinterpret_cast'ing of
      # raw shared-memory bytes, exactly the kind of code those sanitizers
      # are worth running against.
      - name: Build and run test_telemetry (release + ASan/UBSan)
        run: |
          g++ -O3 -march=native -std=c++17 -Wall -Wextra -Wpedantic -Iinclude \
            tests/test_telemetry.cpp -o tests/build/test_telemetry -lpthread
          g++ -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c++17 \
            -Wall -Wextra -Wpedantic -Iinclude \
            tests/test_telemetry.cpp -o tests/build/test_telemetry_sanitized -lpthread
          ./tests/build/test_telemetry
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ./tests/build/test_telemetry_sanitized

      # scripts/animus_stat.py's own accuracy test: an independent,
      # pure-Python reader (no C++ toolchain, no compiled extension --
      # animus_stat.py works even where _animus_shm_native isn't built)
      # sampling a ring's header, built directly with struct.pack_into,
      # WHILE a background thread concurrently advances its write cursor
      # -- see tests/test_animus_stat.py's own header comment. Uses
      # unittest's stdlib discovery rather than pytest, since no Python
      # test in this workflow has needed a third-party test runner before
      # and this one shouldn't be the first to add that dependency.
      - name: test_animus_stat -- accurate sampling while a producer is writing
        run: python3 -m unittest discover -s tests -p "test_animus_stat.py" -v

      # The actual Milestone 4 deliverable: two independent OS processes
      # (the release, non-sanitized C++ producer and a separate Python
      # interpreter) exchanging 10,000,000 records through real POSIX
      # shared memory under /dev/shm, with zero loss and validated
      # integrity end to end. Uses the release build, not the sanitized
      # one, so the numbers reflect real performance, not instrumented
      # overhead.
      - name: Cross-process 10,000,000-event harness (backpressure, zero-loss)
        working-directory: benchmarks
        shell: bash
        run: |
          ./build/harness_benchmark --name ci_harness_10m --events 10000000 --capacity 1048576 \
            --backpressure --json harness_10m.json &
          producer_pid=$!
          sleep 0.5
          python3 consumer.py --name ci_harness_10m --events 10000000 --idle-timeout-s 10 | tee consumer_10m.log
          consumer_status=${PIPESTATUS[0]}
          wait "$producer_pid"
          producer_status=$?
          echo "producer_status=$producer_status consumer_status=$consumer_status"
          grep -q "events consumed:     10000000" consumer_10m.log
          grep -q "sequence gaps seen:  0 " consumer_10m.log
          grep -q "data integrity:      OK (monotonic, no repeats/reversals)" consumer_10m.log
          [ "$producer_status" -eq 0 ] && [ "$consumer_status" -eq 0 ]

      # Standalone decoupled-overwrite run at full scale (no live consumer)
      # -- proves the producer's own claim in harness_benchmark.cpp's file
      # header: it is fully self-contained and never blocks even with
      # nothing draining the ring, and dropped_count() deterministically
      # accounts for every record that didn't survive.
      - name: Cross-process 10,000,000-event harness (standalone overwrite mode)
        working-directory: benchmarks
        run: |
          ./build/harness_benchmark --name ci_harness_10m_overwrite --events 10000000 \
            --unlink-when-done --json harness_10m_overwrite.json

      - name: Upload benchmark JSON + consumer log
        uses: actions/upload-artifact@v4
        with:
          name: linux-shm-harness-results
          path: |
            benchmarks/harness_10m.json
            benchmarks/harness_10m_overwrite.json
            benchmarks/consumer_10m.log
            tests/consumer_ee.log
            tests/producer_ee.log
            tests/consumer_ob.log
            tests/producer_ob.log
            tests/producer.log
            tests/fast.log
            tests/slow.log
