<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="animusLogoTitle">
  <title id="animusLogoTitle">Animus Core</title>
  <!--
    Canonical enterprise brand lockup. Square canvas (1024x1024) so a
    2x raster render (2048x2048) is undistorted. Mark occupies its
    native 512x512 box, offset to (256,154); wordmark and tagline are
    centered beneath it with balanced top/bottom clear space.
  -->
  <rect x="0" y="0" width="1024" height="1024" fill="#09090b"/>

  <g transform="translate(256,154)">
    <g fill="none" stroke-linejoin="round" stroke-linecap="round" shape-rendering="geometricPrecision">
      <path d="M 180,80 L 332,80 Q 442,170 256,470 Q 70,170 180,80 Z" stroke="#EF4444" stroke-width="7"/>
      <path d="M 187.6,93 L 324.4,93 Q 423.4,174 256,444 Q 88.6,174 187.6,93 Z" stroke="#F43F5E" stroke-width="3.5"/>
    </g>
    <g shape-rendering="geometricPrecision" transform="translate(256,272) scale(1.28) skewX(-6) translate(-100,-100)">
      <path d="M 100 18 L 18 182 L 68 182 Z" fill="#00F0FF"/>
      <path d="M 100 18 L 132 182 L 182 182 Z" fill="#00F0FF"/>
      <path d="M 100 106 L 119 168 L 81 168 Z" fill="#22D3EE"/>
    </g>
  </g>

  <text x="512" y="770" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700"
        font-size="100" letter-spacing="26" fill="#FFFFFF">ANIMUS</text>

  <text x="512" y="826" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500"
        font-size="26" letter-spacing="7" fill="#94A3B8">DETERMINISTIC TELEMETRY • BARE-METAL C++</text>
</svg>
