<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="animusMarkTitle">
  <title id="animusMarkTitle">Animus Core mark</title>
  <!--
    Canonical Animus Core mark: a 5-point angular crest (flat top,
    angled shoulders, sharp bottom point), wireframe outer + inset
    inner border, plus two crossing facet lines below the top edge
    for faceted depth. All coordinates are exact and mirrored about
    x=256; the source's stray circuit-tendril dots are intentionally
    not reproduced. Central mark is the forward-leaning chevron "A".
  -->
  <rect x="0" y="0" width="512" height="512" fill="#09090b"/>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round" shape-rendering="geometricPrecision">
    <!-- outer crest: flat top, sides bow out through the shoulders, taper to a sharp bottom point -->
    <path d="M 180,80 L 332,80 Q 442,170 256,470 Q 70,170 180,80 Z" stroke="#EF4444" stroke-width="7"/>
    <!-- inner crest: same construction inset toward centroid (256,210) -->
    <path d="M 187.6,93 L 324.4,93 Q 423.4,174 256,444 Q 88.6,174 187.6,93 Z" stroke="#F43F5E" stroke-width="3.5"/>
  </g>

  <g shape-rendering="geometricPrecision" transform="translate(256,272) scale(1.28) skewX(-6) translate(-100,-100)">
    <path d="M 100 18 L 18 182 L 68 182 Z" fill="#00F0FF"/>
    <path d="M 100 18 L 132 182 L 182 182 Z" fill="#00F0FF"/>
    <path d="M 100 106 L 119 168 L 81 168 Z" fill="#22D3EE"/>
  </g>
</svg>
