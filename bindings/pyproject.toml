[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "animus-native-stream"
version = "0.1.0"
description = "Zero-copy Python interop over Animus Engine's in-process SPSC telemetry ring (nanobind)"
readme = "../README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "Alakshendra Roy", email = "royrichie006@gmail.com" }]

# Its own installable unit -- `pip install ./bindings` builds and installs
# just the compiled _animus_native extension, into the same animus/
# package the root animus-engine-sdk project owns. No wheel.packages
# entry below on purpose: this wheel ships no .py files of its own (those
# are animus/consumer.py etc., part of the main package's own build) --
# only CMake's install(TARGETS _animus_native LIBRARY DESTINATION animus)
# contributes to this wheel's contents. Safe to install alongside
# animus-engine-sdk in the same environment: the two wheels never
# contribute the same file, so there's nothing to conflict over (see
# bindings/CMakeLists.txt's top comment for the full reasoning).
dependencies = []

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build"
wheel.packages = []

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
