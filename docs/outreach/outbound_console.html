// ---------- Persistence ----------
const LS_KEY = "animus_outbound_console_v1";
function loadOverrides(){ try{ return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); }catch(e){ return {}; } }
function saveOverrides(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){} }
let overrides = loadOverrides();

const PIPE_LABEL = {py:"Python-Bridge (Global)", raw:"Raw-Engine Global Soak", "in":"Indian Domestic", gs:"Gaming & Security"};
const PIPE_DOT = {py:"var(--py)", raw:"var(--raw)", "in":"var(--in)", gs:"var(--gs)"};

let activeFilter = "all";

function effectiveStatus(a){
  const ov = overrides[a.id];
  if(ov === "sent") return "sent";
  if(ov === "unsent") return a.status;
  return a.status;
}

function matchesFilter(a){
  const st = effectiveStatus(a);
  switch(activeFilter){
    case "all": return true;
    case "in": return a.pipeline === "in";
    case "gs": return a.pipeline === "gs";
    case "ready": return st === "ready";
    case "contacted": return st === "contacted" || st === "bounced" || st === "sent";
    default: return true;
  }
}

function statusBadge(a){
  const st = effectiveStatus(a);
  if(st === "sent") return '<span class="badge status-sent">SENT ✓</span>';
  if(st === "contacted") return '<span class="badge status-contacted">CONTACTED ('+(a.statusDate||"")+')</span>';
  if(st === "bounced") return '<span class="badge status-bounced">BOUNCED ('+(a.statusDate||"")+')</span>';
  return '<span class="badge status-ready">READY</span>';
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  const list = document.getElementById("list");
  const groups = {py:[], raw:[], "in":[], gs:[]};
  ACCOUNTS.filter(matchesFilter).forEach(a => groups[a.pipeline].push(a));

  let html = "";
  ["py","raw","in","gs"].forEach(p => {
    if(groups[p].length === 0) return;
    html += '<div class="pipeline-heading"><span class="dot" style="background:'+PIPE_DOT[p]+'"></span>'+PIPE_LABEL[p]+' ('+groups[p].length+')</div>';
    groups[p].forEach(a => { html += cardHtml(a); });
  });
  if(html === "") html = '<div class="empty">No accounts match this filter.</div>';
  list.innerHTML = html;

  document.querySelectorAll("[data-copy]").forEach(btn => btn.addEventListener("click", () => copyDraft(btn.getAttribute("data-copy"))));
  document.querySelectorAll("[data-mark]").forEach(btn => btn.addEventListener("click", () => toggleSent(btn.getAttribute("data-mark"))));

  updateCounts();
}

function cardHtml(a){
  const st = effectiveStatus(a);
  const locked = st === "contacted";
  const lc = a.longcycle ? '<span class="badge longcycle">LONG-CYCLE</span>' : "";
  return '<div class="card '+(locked?"locked":"")+'">'
    + '<div class="row1">'
      + '<span class="firm">'+escapeHtml(a.firm)+'</span>'
      + '<span class="badge pipe-'+a.pipeline+'">'+PIPE_LABEL[a.pipeline]+'</span>'
      + '<span class="badge tier-'+(a.tier==="A"?"A":"B")+'">Tier '+escapeHtml(a.tier)+'</span>'
      + statusBadge(a)
      + lc
    + '</div>'
    + '<div class="meta"><b>'+escapeHtml(a.persona)+'</b> · '+escapeHtml(a.domain)+' · '+escapeHtml(a.channel)+(a.contact?(' · '+escapeHtml(a.contact)):"")+'</div>'
    + (a.notes ? '<div class="notes">'+escapeHtml(a.notes)+'</div>' : "")
    + '<details><summary>Preview draft</summary><pre>'+escapeHtml(a.draft)+'</pre></details>'
    + '<div class="actions">'
      + '<button class="primary" data-copy="'+a.id+'">Copy Draft</button>'
      + '<button '+(st==="sent"?'class="sent-on" ':'')+(locked?'disabled ':'')+'data-mark="'+a.id+'">'+(st==="sent"?"Marked Sent ✓ (undo)":"Mark Sent")+'</button>'
    + '</div>'
  + '</div>';
}

function findAccount(id){ return ACCOUNTS.find(a => a.id === id); }

function copyDraft(id){
  const a = findAccount(id);
  if(!a) return;
  const text = a.draft;
  const done = () => showToast('Draft copied for '+a.firm);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  cb();
}

function toggleSent(id){
  const a = findAccount(id);
  if(!a || a.status === "contacted") return;
  const cur = overrides[id];
  overrides[id] = (cur === "sent") ? "unsent" : "sent";
  saveOverrides(overrides);
  render();
  showToast(overrides[id] === "sent" ? (a.firm+' marked Sent') : (a.firm+' reverted to Ready'));
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove("show"), 1800);
}

function updateCounts(){
  const total = ACCOUNTS.length;
  const ready = ACCOUNTS.filter(a => effectiveStatus(a) === "ready").length;
  const contacted = ACCOUNTS.filter(a => effectiveStatus(a) === "contacted").length;
  const bounced = ACCOUNTS.filter(a => effectiveStatus(a) === "bounced").length;
  const sent = ACCOUNTS.filter(a => effectiveStatus(a) === "sent").length;
  document.getElementById("counts").innerHTML =
    '<span><b>'+total+'</b> total</span><span><b>'+ready+'</b> ready</span><span><b>'+sent+'</b> marked sent</span><span><b>'+contacted+'</b> contacted</span><span><b>'+bounced+'</b> bounced</span>';
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeFilter = tab.getAttribute("data-filter");
    render();
  });
});

render();
</script>
</body>
</html>
