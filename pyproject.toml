[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animus-engine-sdk"
version = "1.2.0"
description = "High-Performance Low-Latency C++/Python Event Ingestion, SOAR & Distributed Clustering Engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "Alakshendra Roy", email = "royrichie006@gmail.com" }]
keywords = [
    "telemetry",
    "event-processing",
    "soar",
    "low-latency",
    "security",
    "distributed-systems",
    "raft",
    "mtls",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: C++",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
# Zero-dependency SDK (CLAUDE.md): everything animus/ imports -- ctypes,
# multiprocessing.shared_memory, threading -- is Python 3.8+ stdlib.
dependencies = []

[project.urls]
Homepage = "https://github.com/alakshendra-roy/AnimusCore_v1"
Documentation = "https://github.com/alakshendra-roy/AnimusCore_v1/blob/master/AnimusCore_v1/QUICKSTART.md"
Issues = "https://github.com/alakshendra-roy/AnimusCore_v1/issues"

[tool.setuptools]
packages = ["animus"]

[tool.setuptools.package-data]
# Bundles the compiled native engine inside the wheel itself (staged into
# animus/ by setup.py's build_py override) so an installed wheel is
# self-contained and doesn't depend on a sibling source checkout --
# animus.bindings.load_native_library checks the package directory first
# for exactly this reason.
animus = ["*.dll", "*.so", "*.dylib"]
